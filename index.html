    <script>
      // Ensure window.fetch has both getter and setter so browser extensions can wrap it safely
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch || _origFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          try {
            if (window.Window && window.Window.prototype) {
              var _protoFetch = window.Window.prototype.fetch;
              Object.defineProperty(window.Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _protoFetch;
                },
                set: function(fn) {
                  _protoFetch = fn;
                }
              });
            }
          } catch (e2) {}
        }

        // Intercept and prevent extension-related runtime errors from halting the application
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.error && event.error.stack && event.error.stack.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.stack &&
            event.reason.stack.indexOf('chrome-extension://') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
